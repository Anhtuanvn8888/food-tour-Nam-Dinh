  itinerary.push(streetPairs[i]);
  if(i<stops.length)itinerary.push([stops[i],streetPairs[(i+3)%streetPairs.length][i%2]]);
  const crossing={1:36,4:35,7:37,9:38,11:39}[i];
  if(crossing)itinerary.push([crossing]);
}
function route(index){
  const lap=Math.floor(index/itinerary.length),step=index%itinerary.length;
  if(!lap)return itinerary[step];

  const pair=itinerary[(step+swap)%itinerary.length];
  return lap%2?pair.slice().reverse():pair;
}

function face(color,vertices,seam=false){

    const c=segment(i);
    if(c.bridge){
      bridgeView(c,travel,time,lights);
      const z=c.start+34-travel;
      if(z>8&&z<53)signs.push({z,x:0,p:places[c.sides[0].id],on:true});
    }
    for(const side of c.sides){
      if(c.bridge)continue;
      const sign=setpiece(side,time);
      if(!sign)continue;
      signs.push(sign);
      if(sign.on&&!sign.p.landmark){
        const edge=Math.sign(sign.x)*3.4;
        for(let band=0;band<5;band++){
          const half=.4+band*.22;
          quad('rgba(247,165,91,'+(.15-band*.025)+')',edge-half,edge+half,sign.z-2.2-band*.34,sign.z-.7+band*.38,.024);
        }
      }
    }
    for(const o of c.obstacles)if(o.z-travel<95&&!o.passed)roadProp(o,o.z-travel);
    for(const f of c.flies)if(!f.taken&&f.z-travel>1.2&&f.z-travel<100)lights.push({x:f.x,z:f.z-travel,y:1.08+Math.sin(time*5+f.z)*.16,fly:true});
  }
  if(state==='ready')playerX=0;
  oval('#141d2d88',...project(playerX,.015,PLAYER_Z),focal/PLAYER_Z*.58,9);
  const motion=state==='ready'?time*.27:rideTime;
  const tailLight=equipped.vehicle==='bike'?cyclist(motion):motorVehicle(motion,equipped.vehicle);
  if(equipped.pet!=='none')companion(motion,equipped.pet);
  renderFaces();
  glow(tailLight.x,tailLight.y,13,'254,98,70',.29);
  const garland=Math.floor(travel/24);
  for(let i=0;i<4;i++){
    const z=(garland+i+1)*24-travel;
    if(z<8||segment(Math.floor((z+travel)/CHUNK)).bridge)continue;
    const cord=[];
    for(let j=0;j<7;j++){
      const x=(j-3)*1.65, y=4.35+Math.abs(j-3)*.2;
      const [px,py]=project(x,y,z);
      cord.push([px,py]);
      if(j%2===1||z<40){
        const r=Math.min(8,focal/z*.12);
        glow(px,py+r*1.5,r*3.8,'255,173,86',.44);
        oval(j%2?'#ffd58a':'#f8ad67',px,py+r*1.5,r*.77,r);
      }
    }
    line('#a8826559',1,cord);
  }
  for(const s of signs){
    const [x,yy]=project(s.x,s.p.landmark?5.51:2.27,s.z-(s.p.landmark?0:1.91));
    if(s.on&&!s.p.landmark&&s.p.food!=='tea'&&s.z>5){
      for(let i=0;i<3;i++){
        const rise=(time*.72+i*.2)%1;
        const [sx,sy]=project(s.x+.28+i*.11+Math.sin(time*2+i)*rise*.3,.96+rise*.81,s.z-2.24);
        const spread=focal/s.z*(.04+rise*.16);
        oval('rgba(255,229,184,'+(.33*(1-rise))+')',sx,sy,spread,spread*.59);
      }
    }
    if(s.z>8&&s.z<47){
      const title=s.p.sign??s.p.name, size=Math.min(14,Math.max(7,focal/s.z*.57));
      pen.font='700 '+size+'px system-ui';
      const width=Math.min(W/2-7,pen.measureText(title).width+13);
      const center=Math.max(width/2+3,Math.min(W-width/2-3,x));
      fill('#172035e8',center-width/2,yy-size-4,width,size+9);
      fill(s.on?'#ffd17e':'#a9765d',center-width/2,yy+4,width,1);
      pen.fillStyle='#ffe6bb';pen.textAlign='center';pen.fillText(title,center,yy,width-9);
    }
  }
  for(const l of lights){
    if(l.z<=2 || l.z>140 || (!l.fly && l.z<PLAYER_Z))continue;
    const [x,yy]=project(l.x,l.y,l.z), size=Math.min(9,focal/l.z*.085);
    if(x<0||x>W||yy>H)continue;
    glow(x,yy,size*(l.fly?3.2:5),'255,183,93',l.fly?.69:.26);
    if(l.fly)oval('#fff0a7',x,yy,size,size);
  }
  for(const s of sparks){
    if(s.z-distance<2)continue;
    const [x,yy]=project(s.x,s.y,s.z-distance);
    glow(x,yy,9,'255,205,128',Math.min(.8,s.life));oval('#ffe28c',x,yy,1.8,1.8);
  }
}
function update(dt){
  const rules=modes[runMode];
  const speed=rules.speed+Math.min(distance*rules.ramp,rules.boost);
  const before=distance+PLAYER_Z;
  distance+=speed*dt;
  const at=distance+PLAYER_Z, index=Math.floor(at/CHUNK), c=segment(index);
  for(const key of chunks.keys())if(key<index-1)chunks.delete(key);
  buffered=Math.max(0,buffered-dt);
  const beforeX=playerX;
  playerX+=(LANES[lane]-playerX)*(1-Math.exp(-12*dt));
  lean+=(Math.max(-1,Math.min(1,(playerX-beforeX)/(dt*8||1)))-lean)*(1-Math.exp(-13*dt));
  rideTime+=dt*(.78+speed/67);
  petX+=(playerX-petX)*(1-Math.exp(-5*dt));
  const milestones=Math.floor(distance/25);
  if(milestones>distanceReward){earn(milestones-distanceReward);distanceReward=milestones}
  if(y>0||vy>0){y+=vy*dt;vy-=22*dt;if(y<0){y=0;vy=0}}
  if(y===0&&buffered>0){buffered=0;vy=7.6;effect('jump')}
  if(at>c.start+38)for(const side of c.sides)if(places[side.id].landmark)reveal(side);
  for(const f of c.flies){
    if(!f.taken&&Math.abs(f.z-at)<1.3&&Math.abs(f.x-playerX)<.69){
      f.taken=true;gathered++;bonus+=10;earn(1);effect('fly');
      c.collected++;
      if(c.collected%4===0){
        const shop=c.sides.find(side=>!side.lit&&!places[side.id].landmark);
        if(shop)reveal(shop);
      }
    }
  }
  for(const o of c.obstacles){
    if(!o.passed&&before<o.z&&at>=o.z){
      if(Math.abs(o.x-playerX)<.89&&y<(o.kind===0?.24:o.kind===1?.68:.62)){finish();return}
      o.passed=true;
    }
  }
  for(let i=sparks.length-1;i>=0;i--){const s=sparks[i];s.life-=dt;s.y+=dt*1.8;if(s.life<=0)sparks.splice(i,1)}
  points=Math.floor(distance)+bonus;
  music();
}
function hudText(id,text){
  const node=get(id);
  if(node.textContent!==text)node.textContent=text;
}
let simulationCarry=0,lastIdlePaint=-Infinity,slowFrames=0;
const simStep=1/120;
function frame(ms){
  const elapsed=previous?Math.min(.09,(ms-previous)/1000):0;
  previous=ms;
  const running=state==='run'&&!get('journal').open&&!get('garage').open&&!document.hidden;
  if(running){
    simulationCarry+=elapsed;
    while(simulationCarry>=simStep&&state==='run'){
      update(simStep);
      simulationCarry-=simStep;
    }
    const c=segment(Math.floor((distance+PLAYER_Z)/CHUNK));
    hudText('place',c.sides.map(side=>places[side.id].name).join(' · '));
    hudText('score',format(points)+' điểm');
    hudText('flies',format(Math.floor(distance))+' m · +'+tripCoins+' xu');
    if(elapsed>.031)slowFrames++;
    else slowFrames=Math.max(0,slowFrames-1);
    if(slowFrames>=16&&quality>.72){
      quality=quality>.85?.84:.72;
      slowFrames=0;
      resize();
    }
    draw(ms/1000);
  }else{
    simulationCarry=0;
    if(!document.hidden&&!get('journal').open&&!get('garage').open&&ms-lastIdlePaint>=80){
      draw(ms/1000);
      lastIdlePaint=ms;
    }
  }
  if(ms>noticeUntil && !get('notice').hidden)get('notice').hidden=true;
  requestAnimationFrame(frame);
}
function start(){
  bankTrip();
  runMode=selectedMode;tripCoins=0;savedTripCoins=0;distanceReward=0;petX=0;
  get('mode-picker').hidden=true;get('mode-note').hidden=true;
  enableAudio();simulationCarry=0;canvas.focus({preventScroll:true});state='run';document.body.classList.remove('paused');document.body.classList.add('running');distance=0;y=0;vy=0;lane=1;playerX=0;lean=0;rideTime=0;
  chunks.clear();sparks.length=0;lit=0;gathered=0;buffered=0;step=0;nextNote=0;points=0;bonus=0;
  get('overlay').hidden=true;get('stats').hidden=false;get('notice').hidden=true;
}
function finish(){
  state='over';document.body.classList.remove('running','paused');effect('crash');points=Math.floor(distance)+bonus;
  bankTrip();
  if(points>(records[runMode]||0)){
    records[runMode]=points;
    if(runMode==='normal')save('cun-best-3d',points);
    saveProgress();record();
  }
  get('mode-picker').hidden=false;get('mode-note').hidden=false;
  get('heading').textContent='Gặp chướng ngại!';
  get('summary').textContent=format(points)+' điểm · '+format(Math.floor(distance))+' m · +'+tripCoins+' xu';
  get('play').textContent='Đạp lại';get('overlay').hidden=false;
}
function jump(){if(state==='run')buffered=.11}
function shift(direction){if(state==='run')lane=Math.max(0,Math.min(2,lane+direction))}
const playButton=get('play'), pauseButton=get('pause-run');
function pauseGame(){
  if(state!=='run')return;
  bankTrip();
  state='pause';
  document.body.classList.replace('running','paused');
  get('heading').textContent='Tạm dừng';
  get('summary').textContent=format(points)+' điểm';
  playButton.textContent='Đạp tiếp';
  get('overlay').hidden=false;
}
function resumeGame(){
  enableAudio();state='run';
  document.body.classList.replace('paused','running');
  get('overlay').hidden=true;canvas.focus({preventScroll:true});
}
playButton.onclick=()=>state==='pause'?resumeGame():start();
pauseButton.onclick=()=>state==='pause'?resumeGame():pauseGame();
document.addEventListener('visibilitychange',()=>{if(document.hidden)pauseGame()});
get('left-control').onclick=()=>shift(-1);
get('jump-control').onclick=jump;
get('right-control').onclick=()=>shift(1);
let pointer;
canvas.addEventListener('pointerdown',event=>{
  if(!event.isPrimary || (event.pointerType==='mouse'&&event.button!==0))return;
  pointer={id:event.pointerId,x:event.clientX,y:event.clientY,moved:false};
  canvas.setPointerCapture(event.pointerId);
});
canvas.addEventListener('pointermove',event=>{
  if(pointer?.id!==event.pointerId||pointer.moved)return;
  const dx=event.clientX-pointer.x,dy=event.clientY-pointer.y;
  if(Math.abs(dx)>26&&Math.abs(dx)>Math.abs(dy)){shift(Math.sign(dx));pointer.moved=true}
  else if(dy<-26){jump();pointer.moved=true}
});
canvas.addEventListener('pointerup',event=>{if(pointer?.id===event.pointerId){if(!pointer.moved)jump();pointer=null}});
canvas.addEventListener('pointercancel',()=>{pointer=null});
window.addEventListener('keydown',event=>{
  if(get('journal').open||get('garage').open)return;
  if(event.code==='Escape'){if(state==='run')pauseGame();else if(state==='pause')resumeGame();return}
  if(!['Space','ArrowUp','ArrowLeft','ArrowRight'].includes(event.code)||get('journal').open || (event.code==='Space'&&document.activeElement.tagName==='BUTTON'))return;
  event.preventDefault();if(event.repeat)return;
  if(event.code==='ArrowLeft')shift(-1);
  else if(event.code==='ArrowRight')shift(1);
  else if(state==='run')jump();
  else if(state==='pause')resumeGame();
  else start();
});
function chooseMode(id){
  if(state==='run'||state==='pause')return;
  selectedMode=id;
  const m=modes[id];
  for(const button of document.querySelectorAll('[data-mode]')){
    button.setAttribute('aria-pressed',String(button.dataset.mode===id));
  }
  get('mode-note').textContent=id==='normal'?'Tập làm quen tuyến phố và các cây cầu.':m.name+' · Xe chạy nhanh hơn, chướng ngại dày hơn · Xu ×'+m.reward;
  saveProgress();record();
}
for(const button of document.querySelectorAll('[data-mode]'))button.onclick=()=>chooseMode(button.dataset.mode);
chooseMode(selectedMode);
function shopAction(kind,item){
  bankTrip();
  if(!owned.has(item.id)){
    if(wallet<item.price)return;
    wallet-=item.price;owned.add(item.id);
  }
  equipped[kind]=item.id;
  saveProgress();
  renderGarage('Đã trang bị '+item.name+'.');
}
function renderGarage(message=''){
  get('bank').textContent='Ví của bạn · '+format(wallet)+' xu';
  get('shop-message').textContent=message||'Nhặt đom đóm, đi xa và thắp đèn quán để kiếm xu.';
  for(const [kind,items] of Object.entries(catalog)){
    get(kind==='vehicle'?'vehicles':'pets').replaceChildren(...items.map(item=>{
      const card=document.createElement('div'), name=document.createElement('strong'), button=document.createElement('button');
      const active=equipped[kind]===item.id, purchased=owned.has(item.id);
      card.className='shop-item'+(active?' equipped':'');
      name.textContent=item.icon+' '+item.name;
      button.textContent=active?'Đang dùng':purchased?'Trang bị':item.price+' xu · Mua';
      button.disabled=active||(!purchased&&wallet<item.price);
      button.onclick=()=>shopAction(kind,item);
      card.append(name,button);
      return card;
    }));
  }
}
get('garage-open').onclick=()=>{pauseGame();bankTrip();renderGarage();get('garage').showModal()};
window.addEventListener('pagehide',bankTrip);
const reviewURL='https://tripmap.vn/en/food_most_reviewed-ninh_binh_phuong_nam_dinh.html';
function journalCard(p,i){
  const entry=document.createElement('li');
  const title=document.createElement('strong');
  title.textContent=p.name;
  const note=document.createElement('div');
  note.className='journal-kind';
  note.textContent=unlocked.has(i)?(p.detail??'Đã ghé trong hành trình'):'Chưa ghé';
  if(unlocked.has(i))entry.classList.add('stamped');
  entry.append(title,note);
  return entry;
}
function journalView(review=false){
  get('stamps-tab').setAttribute('aria-pressed',String(!review));
  get('reviews-tab').setAttribute('aria-pressed',String(review));
  const root=get('entries'), summary=get('collection');
  root.classList.toggle('review-list',review);
  if(!review){
    summary.textContent=unlocked.size+'/'+places.length+' điểm đã khám phá';
    root.replaceChildren(...places.map(journalCard));
    return;
  }
  const source=document.createElement('a');
  source.className='source-link';source.href=reviewURL;source.target='_blank';source.rel='noopener';
  source.textContent='TRIPMAP';
  summary.replaceChildren('Quán đưa vào game có số đánh giá công khai. Số liệu tham khảo tháng 11/2026 từ ',source,'.');
  root.replaceChildren(...places.filter(p=>p.reviews&&!p.source).sort((a,b)=>b.reviews-a.reviews).map(p=>{
    const item=document.createElement('li'), count=document.createElement('strong');
    count.textContent=format(p.reviews);
    item.append(p.name,count);
    return item;
  }));
}
get('stamps-tab').onclick=()=>journalView();
get('reviews-tab').onclick=()=>journalView(true);
get('book').onclick=()=>{pauseGame();journalView();get('journal').showModal()};
requestAnimationFrame(frame);
</script></body></html>
